name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-cursor-dev \
            libxcb-randr0-dev \
            libxcb-xinerama0-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libudev-dev \
            libxext-dev \
            libxfixes-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Validate Linux installer scripts
        if: runner.os == 'Linux'
        run: |
          sh -n packaging/linux/install.sh
          sh -n packaging/linux/uninstall.sh

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package Windows user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'mnemosyne-windows'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item target/release/mnemosyne.exe $package
          Copy-Item README.md $package
          Copy-Item packaging/windows/install.ps1 $package
          Copy-Item packaging/windows/uninstall.ps1 $package
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'mnemosyne-windows-x86_64.zip')

      - name: Package Linux user installer
        if: runner.os == 'Linux'
        run: |
          package="$RUNNER_TEMP/mnemosyne-linux-x86_64"
          mkdir -p "$package"
          cp target/release/mnemosyne README.md packaging/linux/install.sh packaging/linux/uninstall.sh "$package/"
          chmod +x "$package/mnemosyne" "$package/install.sh" "$package/uninstall.sh"
          tar -czf "$RUNNER_TEMP/mnemosyne-linux-x86_64.tar.gz" -C "$RUNNER_TEMP" mnemosyne-linux-x86_64

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-windows-x86_64
          path: ${{ runner.temp }}/mnemosyne-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-linux-x86_64
          path: ${{ runner.temp }}/mnemosyne-linux-x86_64.tar.gz
          if-no-files-found: error
